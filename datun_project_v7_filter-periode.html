function setFieldError(form, name, message){
  const fieldWrap = form.querySelector(`.field[data-f="${name}"]`);
  if(!fieldWrap) return;
  fieldWrap.classList.add('invalid');
  const err = fieldWrap.querySelector('.field-error');
  if(err && message) err.textContent = message;
}
function clearFieldErrors(form){
  form.querySelectorAll('.field.invalid').forEach(el=>el.classList.remove('invalid'));
}
function normalizeText(s){ return String(s || '').trim().replace(/\s+/g, ' '); }
function hasDuplicateRecord(data){
  const key = r => [normalizeText(r.namaDebitur).toLowerCase(), r.unit, normalizeText(r.merek).toLowerCase(), r.tahun, Number(r.pinjaman)||0].join('|');
  const target = key(data);
  return RECORDS.some(r => r.id !== editingId && key(r) === target);
}
function validateForm(form){
  clearFieldErrors(form);
  const requiredFields = ['tanggalInput','tanggalUpdate','namaDebitur','unit','merek','tahun','pinjaman','cmo','sumberOrder','posisi','status'];
  const messages = {
    tanggalInput:'Tanggal input wajib diisi.', tanggalUpdate:'Tanggal update wajib diisi.', namaDebitur:'Nama debitur wajib diisi.', unit:'Pilih unit terlebih dahulu.',
    merek:'Merek wajib diisi.', tahun:'Pilih tahun kendaraan.', pinjaman:'Jumlah pinjaman wajib diisi dan lebih dari 0.',
    cmo:'Pilih CMO penanggung jawab.', sumberOrder:'Sumber order wajib diisi.', posisi:'Pilih posisi proses saat ini.', status:'Pilih status pengajuan.'
  };
  let valid = true;
  requiredFields.forEach(name=>{
    const el = form.querySelector(`[name=${name}]`);
    let ok = true;
    if(name === 'pinjaman') ok = parseRibuan(el.value) > 0;
    else ok = !!String(el.value).trim();
    if(!ok){ setFieldError(form, name, messages[name]); valid = false; }
  });

  const noHpEl = form.querySelector('[name=noHp]');
  if(noHpEl && noHpEl.value.trim() && !/^\d+$/.test(noHpEl.value.trim())){
    setFieldError(form, 'noHp', 'No HP hanya boleh berisi angka.');
    valid = false;
  }

  const tanggalInput = form.querySelector('[name=tanggalInput]').value;
  if(tanggalInput){    const today = todayLocalISO();
    if(tanggalInput > today){
      setFieldError(form, 'tanggalInput', 'Tanggal input tidak boleh melebihi hari ini.');
      valid = false;
    }
  }

  const tanggalUpdate = form.querySelector('[name=tanggalUpdate]').value;
  if(tanggalUpdate){
    const today = todayLocalISO();
    if(tanggalUpdate > today){
      setFieldError(form, 'tanggalUpdate', 'Tanggal update tidak boleh melebihi hari ini.');
      valid = false;
    } else if(tanggalInput && tanggalUpdate < tanggalInput){
      setFieldError(form, 'tanggalUpdate', 'Tanggal update tidak boleh sebelum tanggal input.');
      valid = false;
    }
  }

  const tahun = parseInt(form.querySelector('[name=tahun]').value, 10);
  const currentYear = new Date().getFullYear();
  if(tahun && (tahun < MIN_TAHUN_KENDARAAN || tahun > currentYear)){
    setFieldError(form, 'tahun', `Tahun kendaraan harus antara ${MIN_TAHUN_KENDARAAN} dan ${currentYear}.`);
    valid = false;
  }

  const pinjaman = parseRibuan(form.querySelector('[name=pinjaman]').value);
  if(pinjaman > 10000000000){
    setFieldError(form, 'pinjaman', 'Nilai pinjaman terlalu besar. Periksa kembali nominalnya.');
    valid = false;
  }

  const status = form.querySelector('[name=status]').value;
  const ket = normalizeText(form.querySelector('[name=keterangan]').value);
  if(FINAL_STATUS_LIST.includes(status) && ket.length < 8){
    setFieldError(form, 'keterangan', `Keterangan wajib diisi minimal 8 karakter untuk status ${status}.`);
    valid = false;
  }

  const snapshot = {
    namaDebitur: normalizeText(form.querySelector('[name=namaDebitur]').value),
    unit: form.querySelector('[name=unit]').value,
    merek: normalizeText(form.querySelector('[name=merek]').value),
    tahun: form.querySelector('[name=tahun]').value,
    pinjaman
  };
  if(snapshot.namaDebitur && snapshot.unit && snapshot.merek && snapshot.tahun && snapshot.pinjaman && hasDuplicateRecord(snapshot)){
    setFieldError(form, 'namaDebitur', 'Data serupa sudah ada. Cek kembali agar tidak dobel input.');
    valid = false;
  }

  return valid;
}

async function onSubmitForm(e){
  e.preventDefault();
  const form = e.target;
  if(!validateForm(form)){
    showToast('Mohon periksa kembali field yang bertanda merah.');
    return;
  }
  const submitBtn = form.querySelector('button[type=submit]');
  const originalLabel = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Menyimpan...';

  const fd = new FormData(form);
  const data = {
    tanggalInput: normalizeDateOnly(fd.get('tanggalInput'), todayLocalISO()),
    tanggalUpdate: normalizeDateOnly(fd.get('tanggalUpdate'), todayLocalISO()),
    namaDebitur: normalizeText(fd.get('namaDebitur')),
    namaPasangan: normalizeText(fd.get('namaPasangan')),
    noHp: String(fd.get('noHp')||'').replace(/[^\d]/g,''),
    newRo: fd.get('newRo') || '',
    unit: fd.get('unit'),
    merek: normalizeText(fd.get('merek')),
    tahun: fd.get('tahun'),
    pinjaman: parseRibuan(fd.get('pinjaman')),
    cmo: fd.get('cmo'),
    sumberOrder: normalizeText(fd.get('sumberOrder')),
    posisi: fd.get('posisi'),
    status: fd.get('status'),
    keterangan: normalizeText(fd.get('keterangan'))
  };

  try{
    if(editingId){
      const r = RECORDS.find(x=>x.id===editingId);
      if(!r) throw new Error('Data yang akan diedit tidak ditemukan.');
      // Tanggal Input & Tanggal Update sekarang bersifat fleksibel dan boleh diedit oleh user.
      const posisiChanged = r.posisi !== data.posisi;
      const statusChanged = r.status !== data.status;
      const keteranganChanged = (r.keterangan||'') !== (data.keterangan||'');
      const tanggalInputChanged = r.tanggalInput !== data.tanggalInput;
      const tanggalUpdateChanged = r.tanggalUpdate !== data.tanggalUpdate;
      const prevElapsedHours = workingHoursSince(r.stageEnteredAt);
      const updated = { ...r, ...data, updatedAt: nowISO() };
      // ALUR KERJA SLA: setiap kali terjadi edit/update (apa pun yang diubah — bukan cuma posisi),
      // durasi SLA kembali ke 0 dan mulai berjalan lagi mengikuti ketentuan durasi posisi terbaru.
      updated.stageEnteredAt = nowISO();
      updated.snoozeUntil = null;
      updated.history = [...(r.history||[])];
      if(posisiChanged || statusChanged){
        let note = posisiChanged ? 'Posisi diperbarui' : 'Status diperbarui';
        if(data.keterangan) note += `: ${data.keterangan}`;
        updated.history.push({ timestamp: nowISO(), posisi:updated.posisi, status:updated.status, note });
        if(statusChanged && REMINDER_STOP_STATUSES.includes(data.status)){
          updated.history.push({ timestamp: nowISO(), posisi:updated.posisi, status:updated.status, note: `Status final "${data.status}" — pengingat/reminder otomatis dihentikan.` });
        }
      } else if(keteranganChanged && data.keterangan){
        updated.history.push({ timestamp: nowISO(), posisi:updated.posisi, status:updated.status, note: `Keterangan diperbarui: ${data.keterangan}` });
      }
      if(tanggalInputChanged){
        updated.history.push({ timestamp: nowISO(), posisi:updated.posisi, status:updated.status, note: `Tanggal input diubah dari ${formatTanggalDDMMYY(r.tanggalInput)} menjadi ${formatTanggalDDMMYY(data.tanggalInput)}` });
      }
      if(tanggalUpdateChanged){
        updated.history.push({ timestamp: nowISO(), posisi:updated.posisi, status:updated.status, note: `Tanggal update diset ke ${formatTanggalDDMMYY(data.tanggalUpdate)}` });
      }
      updated.history.push({ timestamp: nowISO(), posisi:updated.posisi, status:updated.status, note: `SLA direset ke 0 (sebelumnya berjalan ${formatWorkDurasi(prevElapsedHours)}), mulai berjalan lagi sesuai ketentuan durasi posisi "${updated.posisi}".` });
      Object.assign(r, updated);
      saveToLocalStorage();
      const synced = await syncUpdateChecked(updated);
      showToast(synced
        ? `Data ${r.namaDebitur} berhasil diperbarui, SLA direset dan tersinkron.`
        : `Data ${r.namaDebitur} berhasil diperbarui lokal, SLA direset. Sync server menunggu koneksi.`);
      if(posisiChanged || statusChanged){
        pushNotification(synced?'success':'sync', `${r.namaDebitur}: diperbarui ke posisi "${r.posisi}" / status "${r.status}"${synced?'':' (menunggu sync)'}.`, { recordId: r.id });
      }
    } else {
      const ts = nowISO();
      const r = {
        id: uid(),
        ...data,
        createdAt: ts,
        updatedAt: ts,
        stageEnteredAt: ts,
        snoozeUntil: null,
        _clientOnly: true, // baru dibuat lokal, belum terkonfirmasi tersimpan di server
        history: [{ timestamp: ts, posisi:data.posisi, status:data.status, note: data.keterangan ? `Pengajuan dibuat: ${data.keterangan}` : 'Pengajuan dibuat' }]
      };
      RECORDS.push(r);
      saveToLocalStorage();
      const synced = await syncCreateChecked(r);
      showToast(synced
        ? `Pengajuan ${r.namaDebitur} berhasil disimpan dan tersinkron.`
        : `Pengajuan ${r.namaDebitur} tersimpan lokal. Sync server menunggu koneksi.`);
      pushNotification(synced?'success':'sync', `Pengajuan baru ditambahkan: ${r.namaDebitur} (${r.unit} ${r.merek})${synced?'':' — menunggu sync'}.`, { recordId: r.id });
    }
    editingId = null;
    setView('dashboard');
  }catch(err){
    console.error(err);
    showToast('Gagal menyimpan data: ' + err.message);
    submitBtn.disabled = false;
    submitBtn.textContent = originalLabel;
  }
}

/* =======================================================================
   BACKUP & RESTORE JSON DATABASE
======================================================================= */
function backupDatabaseJson(){
  if(RECORDS.length === 0){ showToast('Tidak ada data untuk dibackup.'); return; }
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(RECORDS, null, 2));
  const dlAnchorElem = document.createElement('a');
  dlAnchorElem.setAttribute("href", dataStr);
  dlAnchorElem.setAttribute("download", `Backup-DB-TrackingKredit-${todayLocalISO()}.json`);
  dlAnchorElem.click();
  showToast('File backup JSON berhasil diunduh!');
  pushNotification('success', `Backup database (${RECORDS.length} data) berhasil diunduh.`);
}

function restoreDatabaseJson(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (event) => {
    try{
      const imported = JSON.parse(event.target.result);
      if(!Array.isArray(imported)) throw new Error('Format file tidak valid (harus array JSON).');
      const cleanList = imported.map(coerceRecord);
      
      // Merge dengan data eksisting
      const existedIds = new Set(RECORDS.map(r => r.id));
      const map = new Map();
      RECORDS.forEach(r => map.set(r.id, r));
      cleanList.forEach(r => map.set(r.id, r));
      
      RECORDS = Array.from(map.values());
      saveToLocalStorage();
      showToast(`Berhasil memulihkan ${cleanList.length} data pengajuan!`);
      pushNotification('success', `${cleanList.length} data berhasil dipulihkan dari file backup.`);
      renderCards();
      renderTable();
      refreshReminders();
      
      // Coba kirim ke server jika online. Jika gagal, masuk antrean sync v2.
      for(const r of cleanList){
        if(existedIds.has(r.id)){ await syncUpdateChecked(r); }
        else { r._clientOnly = true; await syncCreateChecked(r); }
      }
    }catch(err){
      showToast('Gagal memulihkan file: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function exportExcel(){

    showToast('Export Excel belum siap karena library XLSX gagal dimuat. Coba online atau gunakan Backup JSON.');
    pushNotification('error', 'Export Excel gagal: library XLSX tidak tersedia.');
    return;
  }
  const list = getFilteredSortedRecords();
  if(list.length === 0){ showToast('Tidak ada data untuk diekspor.'); return; }
  try{
    const rows = list.map(r=>({
      'Tanggal Input': formatTanggalDDMMYY(r.tanggalInput),
      'Tanggal Update': formatTanggalDDMMYY(r.tanggalUpdate),
      'Waktu Update Sistem': formatDateTime(r.updatedAt || r.createdAt),

      'Nama Pasangan': r.namaPasangan,
      'No HP': r.noHp || '',
      'New/RO': r.newRo || '',
      'Unit': r.unit,
      'Merek': r.merek,
      'Tahun': r.tahun,
      'Pinjaman (Rp)': Number(r.pinjaman) || 0,
      'CMO': r.cmo,
      'Sumber Order': r.sumberOrder,
      'Posisi': r.posisi,
      'Status': r.status,
      'Keterangan': r.keterangan || '',
      'Durasi SLA Berjalan (jam kerja, sejak update terakhir)': Math.round(workingHoursSince(r.stageEnteredAt)*10)/10,
      'Status Reminder': REMINDER_STOP_STATUSES.includes(r.status) ? 'Berhenti (final)' : 'Aktif'
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [
      {wch:14},{wch:14},{wch:20},{wch:22},{wch:16},{wch:10},{wch:22},{wch:8},{wch:16},{wch:8},{wch:16},{wch:10},{wch:16},{wch:20},{wch:16},{wch:34},{wch:18},{wch:16}
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Data Pengajuan');
    const filename = `Data-Pengajuan-Kredit-${todayLocalISO()}.xlsx`;
    XLSX.writeFile(wb, filename);
    showToast('File Excel berhasil diunduh.');
  }catch(err){
    console.error('Export Excel gagal:', err);
    showToast('Export Excel gagal: ' + (err.message || 'terjadi kesalahan tidak diketahui.'));

/* =======================================================================
   SIDEBAR RESIZE / COLLAPSE
======================================================================= */
const SIDEBAR_KEY = 'sidebar_width_v1';
const SIDEBAR_MIN = 64;
const SIDEBAR_MINI_MAX = 90;
const SIDEBAR_MAX = 340;
const SIDEBAR_DEFAULT = 220;
let sidebarWidth = SIDEBAR_DEFAULT;

function applySidebarWidth(width){
  sidebarWidth = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, width));
  const sidebar = document.getElementById('sidebar');
  sidebar.style.width = sidebarWidth + 'px';
  sidebar.classList.toggle('mini', sidebarWidth <= SIDEBAR_MINI_MAX);
}

function saveSidebarWidth(width){
  try{ localStorage.setItem(SIDEBAR_KEY, JSON.stringify(width)); }catch(e){}
}

function loadSidebarWidth(){
  try{
    const val = localStorage.getItem(SIDEBAR_KEY);
    if(val) return JSON.parse(val);
  }catch(e){}
  return SIDEBAR_DEFAULT;
}

function initSidebarResizer(){
  const resizer = document.getElementById('sidebarResizer');
  const sidebar = document.getElementById('sidebar');
  let dragging = false;

  const onMove = (clientX)=>{
    if(!dragging) return;
    applySidebarWidth(clientX);
  };
  const startDrag = ()=>{
    dragging = true;
    sidebar.classList.add('resizing');
    resizer.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  };
  const endDrag = ()=>{
    if(!dragging) return;
    dragging = false;
    sidebar.classList.remove('resizing');
    resizer.classList.remove('active');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    saveSidebarWidth(sidebarWidth);
  };

  resizer.addEventListener('mousedown', (e)=>{ e.preventDefault(); startDrag(); });
  window.addEventListener('mousemove', (e)=> onMove(e.clientX));
  window.addEventListener('mouseup', endDrag);

  resizer.addEventListener('touchstart', (e)=>{ startDrag(); }, {passive:true});
  window.addEventListener('touchmove', (e)=>{ if(dragging && e.touches[0]) onMove(e.touches[0].clientX); }, {passive:true});
  window.addEventListener('touchend', endDrag);

  resizer.addEventListener('dblclick', ()=>{
    const target = sidebarWidth <= SIDEBAR_MINI_MAX ? SIDEBAR_DEFAULT : SIDEBAR_MIN;
    applySidebarWidth(target);
    saveSidebarWidth(sidebarWidth);
  });
}

   INITIALIZATION (DIPERBAIKI)
======================================================================= */
function setupReminderTimer(){
  if(reminderTimer) clearInterval(reminderTimer);
  const ms = Math.max(1, APP_SETTINGS.reminderIntervalMin) * 60 * 1000;
  reminderTimer = setInterval(async ()=>{
    if(!isDataLoading){
      refreshReminders();
      if(STORAGE_MODE === 'online' && pendingSyncCount() > 0) await processSyncQueue();
    }
  }, ms);
}

function initAIChatWidget(){
  document.getElementById('aiFabBtn').addEventListener('click', ()=>{
    const panel = document.getElementById('aiChatPanel');
    if(panel.classList.contains('open')) closeAIChat(); else openAIChat();
  });
  document.getElementById('aiChatCloseBtn').addEventListener('click', closeAIChat);
  document.getElementById('aiChatSendBtn').addEventListener('click', sendAIChatMessage);
  document.getElementById('aiChatInput').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); sendAIChatMessage(); }
  });
}

document.addEventListener('DOMContentLoaded', async ()=>{
  loadSettings();
  loadNotifs();
  loadChatHistory();
  loadSyncQueue();
  loadTombstones();
  renderNotifBadge();
  applySidebarWidth(loadSidebarWidth());
  initSidebarResizer();
  initAIChatWidget();
  const btnSettings = document.getElementById('btnOpenSettings');
  if(btnSettings) btnSettings.addEventListener('click', openSettingsModal);
  setupReminderTimer();
  await initDataEngine();
});
