<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATUN Project v3 — Tracking Pengajuan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#14213D;
    --ink-2:#1B2A41;
    --ink-soft:#2B3B57;
    --paper:#EEF1F5;
    --paper-2:#FFFFFF;
    --brass:#C9A24B;
    --brass-dark:#A6832E;
    --line:#D8DEE8;
    --text-dim:#5B6B85;

    --c-cekdata:#3E6DBF;
    --c-survey:#4C8577;
    --c-komiteca:#7A5FB5;
    --c-komitekacab:#B5637A;
    --c-ttd:#B57F3E;
    --c-bpkb:#5B7A3E;
    --c-pencairan:#3E9E8C;
    --c-motor:#3E7DBF;
    --c-mobil:#B5763E;

    --c-proses:#3E6DBF;
    --c-batal:#7A7F8C;
    --c-pending:#C99A3E;
    --c-rejectslik:#B5453E;
    --c-rejectnonslik:#B56A3E;
    --c-approved:#3E9E5A;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--brass); color:#fff;}

  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    letter-spacing:-0.01em;
  }

  .mono{font-family:'IBM Plex Mono',monospace;}

  a{color:inherit;}

  /* ---------- App shell ---------- */
  #app{display:flex; min-height:100vh; position:relative;}

  .sidebar{
    width:220px;
    min-width:64px;
    flex-shrink:0;
    background:var(--ink);
    color:#DCE3EF;
    display:flex;
    flex-direction:column;
    padding:24px 16px;
    position:sticky;
    top:0;
    height:100vh;
    overflow:hidden;
    z-index:40;
  }
  .sidebar.resizing{transition:none !important;}
  .sidebar:not(.resizing){transition:width .18s ease, padding .18s ease;}
  .sidebar.mini{padding:24px 10px; align-items:center;}
  .sidebar.mini .brand-text, .sidebar.mini .lbl-text, .sidebar.mini .sidebar-foot{display:none;}
  .sidebar.mini .nav-btn{justify-content:center; padding:11px;}
  .sidebar.mini .brand{text-align:center;}
  .sidebar.mini .nav{align-items:center; width:100%;}

  /* Mobile Backdrop */
  .mobile-backdrop{
    display:none; position:fixed; inset:0; background:rgba(20,33,61,.5);
    backdrop-filter:blur(2px); z-index:35;
  }

  .resizer{
    width:6px;
    flex-shrink:0;
    cursor:col-resize;
    background:transparent;
    position:relative;
    z-index:10;
  }
  .resizer::after{
    content:'';
    position:absolute; top:0; bottom:0; left:2px; width:2px;
    background:var(--line);
    transition:background .15s;
  }
  .resizer:hover::after, .resizer.active::after{background:var(--brass);}
  .resizer-handle{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:18px; height:38px; border-radius:5px;
    background:var(--paper-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:var(--text-dim);
    opacity:0; transition:opacity .15s;
  }
  .resizer:hover .resizer-handle{opacity:1;}
  .brand-icon{display:none; font-family:'Fraunces',serif; font-weight:700; font-size:16px; color:var(--brass);}
  .sidebar.mini .brand-icon{display:block;}
  .brand{
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:600;
    color:#fff;
    margin-bottom:4px;
    line-height:1.2;
  }
  .brand small{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--brass);
    margin-top:6px;
  }
  .nav{margin-top:32px; display:flex; flex-direction:column; gap:4px; width:100%;}
  .nav-btn{
    display:flex; align-items:center; gap:10px; width:100%;
    background:transparent; border:none; color:#B9C4D6;
    padding:11px 12px; border-radius:6px; font-size:14px; font-weight:500;
    cursor:pointer; text-align:left; font-family:'Inter',sans-serif;
    transition:background .15s, color .15s;
  }
  .nav-btn:hover{background:var(--ink-soft); color:#fff;}
  .nav-btn.active{background:var(--brass); color:var(--ink);}
  .nav-btn .ic{width:16px; text-align:center; opacity:.85;}

  .sidebar-foot{
    margin-top:auto;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,.1);
    font-size:11px;
    color:#7C8AA3;
    line-height:1.5;
  }

  .main{flex:1; min-width:0; padding:28px 32px 60px;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; margin-bottom:24px; flex-wrap:wrap;
  }
  .topbar-left{display:flex; align-items:center; gap:14px;}
  .btn-mobile-menu{
    display:none; background:var(--ink); color:#fff; border:none;
    padding:8px 12px; border-radius:6px; font-size:16px; cursor:pointer;
  }
  .topbar h1{font-size:26px; margin:0; font-weight:600;}
  .topbar .sub{color:var(--text-dim); font-size:13px; margin-top:2px;}

  .status-badge-net{
    font-size:11.5px; padding:5px 10px; border-radius:12px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px;
  }
  .status-badge-net.online{background:#E6F4EA; color:#137333;}
  .status-badge-net.offline{background:#FEF7E0; color:#B06000;}
  .status-badge-net.error{background:#FCE8E6; color:#C5221F;}

  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    border-radius:6px; padding:10px 16px; cursor:pointer; border:1px solid transparent;
    display:inline-flex; align-items:center; gap:8px; transition:all .15s;
  }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{background:var(--ink-soft);}
  .btn-brass{background:var(--brass); color:var(--ink);}
  .btn-brass:hover{background:var(--brass-dark); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--line);}
  .btn-ghost:hover{background:#fff; border-color:var(--ink);}
  .btn-danger{background:#fff; color:#B5453E; border-color:#E9C7C4;}
  .btn-danger:hover{background:#B5453E; color:#fff;}
  .btn-sm{padding:6px 10px; font-size:12px; border-radius:5px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* ---------- Cards ---------- */
  .filter-flag{
    display:inline-flex; align-items:center; gap:12px;
    background:#FBF3E1; border:1px solid #E9D8AE; color:var(--brass-dark);
    font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:7px; margin-top:14px;
  }
  .filter-flag .ai-mini-btn{background:transparent;}

  .section-label{
    font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--text-dim); margin:28px 0 12px;
  }
  .cards-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:10px;
  }
  .stat-card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 14px 12px;
    position:relative;
    overflow:hidden;
  }
  .stat-card::before{
    content:'';
    position:absolute; left:0; top:0; bottom:0; width:4px;
    background:var(--accent, var(--ink));
  }
  .stat-card .num{
    font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; line-height:1;
    color:var(--ink);
  }
  .stat-card .lbl{
    font-size:12px; color:var(--text-dim); margin-top:6px; font-weight:500;
  }
  .stat-card.total{
    background:var(--ink); border-color:var(--ink);
  }
  .stat-card.total .num, .stat-card.total .lbl{color:#fff;}
  .stat-card.total .lbl{color:#B9C4D6;}
  .stat-card.total .sub-num{
    font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--brass); margin-top:4px;
  }

  /* ---------- Stamp badges ---------- */
  .stamp{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'Fraunces',serif; font-weight:600; font-size:11px;
    letter-spacing:.03em; text-transform:uppercase;
    padding:4px 9px; border-radius:3px;
    border:1.5px solid currentColor;
    transform:rotate(-2deg);
    white-space:nowrap;
  }
  .stamp::before{content:'●'; font-size:8px;}

  /* ---------- AI Reminder panel ---------- */
  .ai-panel{
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 100%);
    border-radius:12px; padding:18px 20px; color:#fff; margin-bottom:8px;
    border:1px solid var(--ink-soft);
  }
  .ai-panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .ai-title{display:flex; align-items:center; gap:10px; font-weight:600; font-size:14px;}
  .ai-dot{
    width:9px; height:9px; border-radius:50%; background:var(--brass);
    box-shadow:0 0 0 0 rgba(201,162,75,.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(201,162,75,.55);}
    70%{box-shadow:0 0 0 8px rgba(201,162,75,0);}
    100%{box-shadow:0 0 0 0 rgba(201,162,75,0);}
  }
  .ai-body{margin-top:12px;}
  .ai-empty{color:#9FB0CB; font-size:13px; font-style:italic;}
  .ai-item{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
    border-radius:8px; padding:12px 14px; margin-bottom:8px;
  }
  .ai-item-head{display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap;}
  .ai-item-name{font-weight:600; font-size:13.5px;}
  .ai-item-time{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--brass);}
  .ai-item-msg{font-size:13px; color:#DCE3EF; margin-top:6px; line-height:1.5;}
  .ai-item-actions{margin-top:10px; display:flex; gap:8px;}
  .ai-mini-btn{
    font-size:11.5px; font-weight:600; padding:6px 10px; border-radius:5px; cursor:pointer;
    border:1px solid rgba(255,255,255,.25); background:transparent; color:#fff;
  }
  .ai-mini-btn.primary{background:var(--brass); color:var(--ink); border-color:var(--brass);}
  .ai-mini-btn:hover{opacity:.85;}

  /* ---------- Filters + table ---------- */
  .toolbar{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:10px 0 14px;
  }
  .toolbar input[type=text], .toolbar select, .toolbar input[type=date]{
    font-family:'Inter',sans-serif; font-size:13px; padding:9px 11px;
    border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink);
  }
  .toolbar input[type=text]{min-width:220px; flex:1;}
  .toolbar select{min-width:130px;}
  .toolbar input[type=date]{min-width:140px;}

  .table-wrap{
    background:#fff; border:1px solid var(--line); border-radius:10px; overflow:auto;
  }
  table{border-collapse:collapse; width:100%; font-size:12.5px; min-width:1600px;}
  thead th{
    text-align:left; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text-dim); font-weight:700; padding:11px 12px; border-bottom:2px solid var(--ink);
    white-space:nowrap; position:sticky; top:0; background:#fff; cursor:pointer; user-select:none;
  }
  thead th:hover{color:var(--ink); background:#FAFBFD;}
  thead th .sort-arrow{display:inline-block; margin-left:4px; opacity:.4;}
  thead th.active-sort .sort-arrow{opacity:1; color:var(--brass-dark);}
  tbody td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap;}
  tbody tr{transition:background .12s ease;}
  tbody tr:hover{background:#E4E9F2;}
  .money{font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .row-actions{display:flex; gap:6px;}
  .icon-btn{
    width:28px; height:28px; border-radius:6px; border:1px solid var(--line); background:#fff;
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px;
  }
  .icon-btn:hover{background:var(--paper);}
  .icon-btn.danger:hover{background:#FCEDEC; border-color:#E9C7C4;}
  .empty-row td{text-align:center; padding:40px; color:var(--text-dim); font-style:italic;}

  /* ---------- Loading Spinner ---------- */
  .spinner{
    display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,.3);
    border-radius:50%; border-top-color:#fff; animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Form ---------- */
  .form-wrap{
    max-width:760px; background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:32px 36px; margin-top:8px;
  }
  .form-wrap h2{margin:0 0 4px; font-size:22px;}
  .form-wrap .form-sub{color:var(--text-dim); font-size:13px; margin-bottom:26px;}
  .field{margin-bottom:20px;}
  .field label{
    display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--ink);
  }
  .field .hint{font-size:11.5px; color:var(--text-dim); font-weight:400; margin-left:4px;}
  .field input[type=text], .field input[type=date], .field select, .field textarea{
    width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:11px 13px;
    border:1px solid var(--line); border-radius:7px; background:var(--paper); color:var(--ink);
  }
  .field input.mono-input{font-family:'IBM Plex Mono',monospace;}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--brass); background:#fff;
    box-shadow:0 0 0 3px rgba(201,162,75,.18);
  }
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .form-actions{display:flex; gap:10px; margin-top:8px; padding-top:20px; border-top:1px solid var(--line);}
  .field-error{color:#B5453E; font-size:11.5px; margin-top:5px; display:none;}
  .field.invalid input, .field.invalid select, .field.invalid textarea{border-color:#B5453E; background:#FCEEED;}
  .field.invalid .field-error{display:block;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,33,61,.55); backdrop-filter:blur(2px);
    display:none; align-items:flex-start; justify-content:center; padding:40px 20px; z-index:100; overflow:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:#fff; border-radius:12px; width:100%; max-width:640px; max-height:90vh;
    display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-head{
    display:flex; justify-content:space-between; align-items:center; padding:20px 24px;
    border-bottom:1px solid var(--line);
  }
  .modal-head h3{margin:0; font-size:18px;}
  .modal-close{background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-dim); line-height:1;}
  .modal-body{padding:22px 24px; overflow:auto;}
  .modal-foot{padding:16px 24px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end;}

  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 18px;}
  .detail-item .k{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:700;}
  .detail-item .v{font-size:14.5px; margin-top:3px; color:var(--ink); font-weight:500;}
  .detail-item.full{grid-column:1/-1;}

  .history-list{margin-top:18px; border-top:1px solid var(--line); padding-top:16px;}
  .history-list h4{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin:0 0 10px;}
  .history-item{display:flex; gap:10px; font-size:12.5px; padding:8px 0; border-bottom:1px dashed var(--line);}
  .history-item:last-child{border-bottom:none;}
  .history-time{font-family:'IBM Plex Mono',monospace; color:var(--text-dim); flex-shrink:0; width:130px;}

  .toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
  .toast{
    background:var(--ink); color:#fff; padding:12px 18px; border-radius:8px; font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.25); border-left:4px solid var(--brass);
    animation:slidein .25s ease;
  }
  @keyframes slidein{from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;}}

  @media (max-width: 860px){
    .btn-mobile-menu{display:block;}
    .sidebar{position:fixed; left:0; top:0; bottom:0; z-index:50; transform:translateX(-100%); transition:transform .25s ease;}
    .sidebar.open{transform:translateX(0);}
    .mobile-backdrop.open{display:block;}
    .resizer{display:none;}
    .main{padding:20px 16px 60px;}
    .field-row{grid-template-columns:1fr;}
    .detail-grid{grid-template-columns:1fr;}
    .ai-fab{right:16px !important; bottom:16px !important;}
    .ai-chat-panel{width:calc(100vw - 32px) !important; right:16px !important; bottom:80px !important; height:70vh !important;}
    .notif-dropdown{width:calc(100vw - 32px) !important; right:8px !important;}
  }

  /* =========================================================
     NOTIFICATION CENTER
  ========================================================= */
  .topbar-tools{display:flex; align-items:center; gap:10px;}
  .notif-wrap{position:relative;}
  .notif-bell{
    position:relative; width:38px; height:38px; border-radius:9px;
    background:#fff; border:1px solid var(--line); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    color:var(--ink); transition:background .15s;
  }
  .notif-bell:hover{background:var(--paper);}
  .notif-bell .badge{
    position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px;
    background:#B5453E; color:#fff; border-radius:9px; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1; border:2px solid var(--paper);
  }
  .notif-dropdown{
    position:absolute; top:46px; right:0; width:360px; max-height:440px; overflow:auto;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    box-shadow:0 16px 40px rgba(20,33,61,.18); z-index:150; display:none;
  }
  .notif-dropdown.open{display:block;}
  .notif-head{
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff;
  }
  .notif-head h4{margin:0; font-size:14px; font-family:'Fraunces',serif;}
  .notif-head button{background:none; border:none; color:var(--brass-dark); font-size:11.5px; font-weight:600; cursor:pointer;}
  .notif-list{padding:6px;}
  .notif-item{
    display:flex; gap:10px; padding:10px 10px; border-radius:8px; cursor:pointer;
  }
  .notif-item:hover{background:var(--paper);}
  .notif-item.unread{background:#FBF3E1;}
  .notif-item .ic{font-size:16px; flex-shrink:0; margin-top:1px;}
  .notif-item .body{flex:1; min-width:0;}
  .notif-item .msg{font-size:12.5px; color:var(--ink); line-height:1.4;}
  .notif-item .time{font-size:10.5px; color:var(--text-dim); margin-top:3px; font-family:'IBM Plex Mono',monospace;}
  .notif-empty{padding:36px 16px; text-align:center; color:var(--text-dim); font-size:12.5px; font-style:italic;}
  .notif-foot{padding:10px 14px; border-top:1px solid var(--line); text-align:center;}
  .notif-foot label{font-size:11.5px; color:var(--text-dim); display:flex; align-items:center; gap:7px; justify-content:center; cursor:pointer;}

  /* =========================================================
     AI AGENT — FLOATING CHAT
  ========================================================= */
  .ai-fab{
    position:fixed; right:32px; bottom:32px; z-index:150;
    width:58px; height:58px; border-radius:50%;
    background:linear-gradient(135deg, var(--brass) 0%, var(--brass-dark) 100%);
    color:var(--ink); border:none; cursor:pointer; font-size:24px;
    box-shadow:0 10px 30px rgba(166,131,46,.45);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s;
  }
  .ai-fab:hover{transform:scale(1.06);}
  .ai-fab .fab-dot{
    position:absolute; top:2px; right:2px; width:12px; height:12px; border-radius:50%;
    background:#3E9E5A; border:2px solid var(--paper);
  }
  .ai-chat-panel{
    position:fixed; right:32px; bottom:104px; width:380px; height:520px; max-height:70vh;
    background:#fff; border-radius:16px; box-shadow:0 24px 60px rgba(20,33,61,.3);
    border:1px solid var(--line); z-index:150; display:none;
    flex-direction:column; overflow:hidden;
  }
  .ai-chat-panel.open{display:flex;}
  .ai-chat-head{
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 100%); color:#fff;
    padding:16px 18px; display:flex; align-items:center; justify-content:space-between;
  }
  .ai-chat-head .who{display:flex; align-items:center; gap:10px;}
  .ai-chat-head .who .ttl{font-family:'Fraunces',serif; font-weight:600; font-size:14.5px;}

<script>
/* =======================================================================
   DATA LAYER — Offline-First Smart Persistence (Local + Google Sheets)
======================================================================= */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz7BcPePKaZrLf_Pw8g2szSVVGLhUsaxNqU9qMU6iN208YM-M5WuzOBGB5QiewQ7533lg/exec';
const LOCAL_STORAGE_KEY = 'tracking_kredit_db_v3';
const NOTIF_KEY = 'tracking_kredit_notif_v1';
const SETTINGS_KEY = 'tracking_kredit_settings_v1';
const CHAT_HISTORY_KEY = 'tracking_kredit_chat_v1';
const SYNC_QUEUE_KEY = 'tracking_kredit_sync_queue_v2';
const APP_VERSION = '3.0.0';
const DEFAULT_SETTINGS = {
  browserNotif: false,
  soundNotif: true,
  aiApiKey: '',
  aiModel: 'claude-sonnet-5',
  reminderIntervalMin: 5,
  holidayDates: '', // format: YYYY-MM-DD, satu tanggal per baris / dipisah koma
  whatsappEnabled: false,
  whatsappWebhookUrl: '',
  whatsappRecipient: '', // format internasional, contoh: 62812xxxx
  whatsappClientSecret: ''
};

const POSISI_LIST = ['Cek Data','Survey','Komite CA','Komite Kacab','Tanda Tangan Kontrak','Absah BPKB','Pencairan'];
const STATUS_LIST = ['Proses','Batal','Pending','Reject Slik','Reject Non Slik','Approved'];
const FINAL_STATUS_LIST = ['Batal','Reject Slik','Reject Non Slik'];
// Status yang membuat fitur pengingat/reminder berhenti total: Batal, Reject Slik, Reject Non Slik, dan Approved.
const REMINDER_STOP_STATUSES = [...FINAL_STATUS_LIST, 'Approved'];
const CMO_LIST = ['Rahma Sari Dewi Nst','Alfian Ahmad Sufi Harahap','Febri H Ompusunggu','Juni Simbolon','Isra Dewi Sijabat','Ahmat Khairuntoni','Fikri Hafiz','Winda Yusryna'];
const UNIT_LIST = ['Motor','Mobil'];
const NEWRO_LIST = ['NEW','RO'];
const MIN_TAHUN_KENDARAAN = 2013;
function buildTahunList(){
  const currentYear = new Date().getFullYear();
  return Array.from({ length: currentYear - MIN_TAHUN_KENDARAAN + 1 }, (_, i) => String(MIN_TAHUN_KENDARAAN + i));
}
const TAHUN_LIST = buildTahunList();

const WORK_START_HOUR = 8;
const WORK_END_HOUR = 19;
const WORK_HOURS_PER_DAY = WORK_END_HOUR - WORK_START_HOUR;
const WORKDAY_LABEL = 'Senin–Sabtu, 08.00–19.00';

// Batas SLA dihitung dalam JAM KERJA, bukan jam kalender.
const STAGE_THRESHOLD_HOURS = {
  'Cek Data': 3,
  'Survey': 6,
  'Komite CA': 4,
  'Komite Kacab': 1,
  'Tanda Tangan Kontrak': 3,
  'Absah BPKB': 6,
  'Pencairan': 6
};

const POSISI_COLOR = {
  'Cek Data':'--c-cekdata','Survey':'--c-survey','Komite CA':'--c-komiteca',
  'Komite Kacab':'--c-komitekacab','Tanda Tangan Kontrak':'--c-ttd',
  'Absah BPKB':'--c-bpkb','Pencairan':'--c-pencairan'
};
const UNIT_COLOR = { 'Motor':'--c-motor', 'Mobil':'--c-mobil' };
const STATUS_COLOR = {
  'Proses':'--c-proses','Batal':'--c-batal','Pending':'--c-pending',
  'Reject Slik':'--c-rejectslik','Reject Non Slik':'--c-rejectnonslik','Approved':'--c-approved'
};

let RECORDS = [];
let STORAGE_MODE = 'syncing'; // 'online' | 'local' | 'syncing' | 'error'
let currentView = 'dashboard';
let editingId = null;
let filters = { q:'', unit:'', cmo:'', posisi:'', status:'', periode:'', dateFrom:'', dateTo:'', sumberOrder:'' };
let sortState = { key:'tanggalInput', dir:'desc' };
let aiMessages = {};
let aiLoading = false;
let isDataLoading = false;
let NOTIFS = [];
let APP_SETTINGS = { ...DEFAULT_SETTINGS };
let CHAT_HISTORY = [];
let SYNC_QUEUE = [];
let notifiedKeys = new Set(); // dedupe: `${id}::${posisi}` already notified this session/persist
let pagination = { page: 1, pageSize: 25 };
let reminderTimer = null;
let isSyncingQueue = false;

function uid(){ return 'r_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }
function todayLocalISO(){
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function normalizeDateOnly(value, fallback = todayLocalISO()){
  if(value instanceof Date && !isNaN(value)){
    const d = new Date(value); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0,10);
  }
  const s = String(value || '').trim();
  if(!s) return fallback;
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const dm = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})$/);
  if(dm){
    const dd = dm[1].padStart(2,'0');
    const mm = dm[2].padStart(2,'0');
    const yyyy = dm[3].length === 2 ? '20' + dm[3] : dm[3];
    return `${yyyy}-${mm}-${dd}`;
  }
  // Dukungan angka serial Excel/Google Sheets jika restore/import dari spreadsheet.
  if(/^\d+(\.\d+)?$/.test(s)){
    const serial = Number(s);
    if(serial > 20000 && serial < 80000){
      const d = new Date(Math.round((serial - 25569) * 86400 * 1000));
      if(!isNaN(d)) return d.toISOString().slice(0,10);
    }
  }
  const parsed = new Date(s);
  if(!isNaN(parsed)){
    parsed.setMinutes(parsed.getMinutes() - parsed.getTimezoneOffset());
    return parsed.toISOString().slice(0,10);
  }
  return fallback;
}
function dateOnlyToISO(dateStr){
  const clean = normalizeDateOnly(dateStr, todayLocalISO());
  return new Date(clean + 'T00:00:00').toISOString();
}
function normalizeDateTime(value, fallbackISO){
  const fallback = fallbackISO || nowISO();
  const s = String(value || '').trim();
  if(!s) return fallback;
  const parsed = new Date(s);
  if(!isNaN(parsed)) return parsed.toISOString();
  return dateOnlyToISO(normalizeDateOnly(s, normalizeDateOnly(fallback)));
}

// Menormalkan sebuah nilai teks ke nilai kanonik yang ada di daftar referensi (STATUS_LIST/POSISI_LIST).
// Ini penting karena data bisa masuk dari sumber luar (Google Sheets diedit manual, import Excel/JSON)
// yang bisa saja menulis "Approved " (ada spasi) atau "REJECT SLIK" (kapitalisasi beda) — kalau tidak
// dinormalkan, perbandingan exact-match (mis. cek status final utk stop reminder) akan gagal walau
// secara makna sama, sehingga reminder terus menyala meski datanya "sudah diupdate".
function normalizeToListValue(value, list){
  const raw = String(value ?? '').trim().replace(/\s+/g, ' ');
  if(!raw) return raw;
  if(list.includes(raw)) return raw;
  const found = list.find(v => v.toLowerCase() === raw.toLowerCase());
  return found || raw; // kalau tetap tidak ada padanannya, biarkan apa adanya agar terdeteksi sbg data tidak valid
}

function coerceRecord(rec){
  // PENTING: tanggalInput TIDAK BOLEH otomatis di-default ke hari ini. Field ini hanya boleh
  // berubah lewat input manual user di form. Kalau data sumber (server/import/local) memang tidak
  // punya tanggal ini, biarkan kosong ('') supaya terlihat jelas belum diisi — jangan diam-diam
  // diisi tanggal hari ini setiap kali data disinkron/dimuat ulang, karena itu bisa membuat tanggal
  // yang sudah benar tertimpa otomatis tanpa sepengetahuan user.
  const tglInput = normalizeDateOnly(rec.tanggalInput || rec['Tanggal Input'] || rec.tanggal || rec.dateInput, '');
  const createdAt = normalizeDateTime(rec.createdAt || rec.created_at, dateOnlyToISO(tglInput));
  const updatedAt = normalizeDateTime(rec.updatedAt || rec.lastUpdatedAt || rec.modifiedAt, createdAt);
  // Field tanggal update bersifat manual/editable oleh user (beda dari updatedAt sistem yg otomatis).
  const tglUpdate = normalizeDateOnly(rec.tanggalUpdate || rec['Tanggal Update'], tglInput);
  // PENTING: semua field di bawah ini diberi alias nama kolom Bahasa Indonesia (spasi + kapital),
  // karena backend Google Sheets kemungkinan mengembalikan data dgn nama kolom seperti itu, bukan
  // camelCase JS. Tanpa alias ini, field bisa terbaca KOSONG khusus di device yg belum punya cache
  // lokal (mis. pertama kali buka di HP) walau datanya sebenarnya ada di server — persis kasus
  // field Keterangan yang hilang saat dibuka di HP.
  return {
    ...rec,
    id: rec.id || uid(),
    namaDebitur: rec.namaDebitur || rec['Nama Debitur'] || 'Tanpa Nama',
    namaPasangan: rec.namaPasangan || rec['Nama Pasangan'] || '',
    noHp: String(rec.noHp || rec['No HP'] || rec['No Hp'] || '').replace(/[^\d]/g,''),
    newRo: normalizeToListValue(rec.newRo || rec['New/RO'] || rec['NEW/RO'], NEWRO_LIST),
    unit: rec.unit || rec['Unit'] || '',
    merek: rec.merek || rec['Merek'] || '',
    tahun: String(rec.tahun ?? rec['Tahun'] ?? ''),
    pinjaman: Number(rec.pinjaman ?? rec['Pinjaman']) || 0,
    cmo: rec.cmo || rec['CMO'] || rec['Cmo'] || '',
    sumberOrder: rec.sumberOrder || rec['Sumber Order'] || '',
    keterangan: rec.keterangan || rec['Keterangan'] || rec.catatan || rec.notes || '',
    status: normalizeToListValue(rec.status || rec['Status'], STATUS_LIST),
    posisi: normalizeToListValue(rec.posisi || rec['Posisi'], POSISI_LIST),
    tanggalInput: tglInput,
    tanggalUpdate: tglUpdate,
    createdAt,
    updatedAt,
    stageEnteredAt: normalizeDateTime(rec.stageEnteredAt || rec.createdAt, createdAt),
    history: Array.isArray(rec.history) ? rec.history : []
  };
}

function saveToLocalStorage(){
  try{
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(RECORDS));
  }catch(e){
    console.warn('Gagal menyimpan ke localStorage:', e);
  }
}

function loadFromLocalStorage(){
  try{
    const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
    if(raw !== null){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)){
        return parsed.map(coerceRecord);
      }
    }
  }catch(e){}
  return null;
}

/* =======================================================================
   TOMBSTONE — Jejak permanen ID yang sudah dihapus dari app ini.
   Mencegah "kebangkitan hantu": data yang sudah dihapus (via tombol Hapus,
   ATAU dihapus langsung di Google Sheets) tidak boleh muncul lagi walau
   proses sync sempat gagal/terlambat/race-condition dengan gasList().
======================================================================= */
const TOMBSTONE_KEY = 'datun_tombstones_v1';
let TOMBSTONES = {}; // { [id]: isoTimestampDihapus }
function loadTombstones(){
  try{
    const raw = localStorage.getItem(TOMBSTONE_KEY);
    TOMBSTONES = raw ? JSON.parse(raw) : {};
  }catch(e){ TOMBSTONES = {}; }
}
function saveTombstones(){
  try{ localStorage.setItem(TOMBSTONE_KEY, JSON.stringify(TOMBSTONES)); }catch(e){}
}
function markTombstone(id){
  TOMBSTONES[id] = nowISO();
  saveTombstones();
}
function pruneOldTombstones(){
  // Tombstone cukup disimpan 60 hari — cukup panjang untuk menutup semua kemungkinan
  // race-condition sync, tapi tidak menumpuk selamanya di localStorage.
  const cutoff = Date.now() - 60*24*3600*1000;
  let changed = false;
  Object.keys(TOMBSTONES).forEach(id=>{
    if(new Date(TOMBSTONES[id]).getTime() < cutoff){ delete TOMBSTONES[id]; changed = true; }
  });
  if(changed) saveTombstones();
}

/* =======================================================================
   SYNC QUEUE — v2: validasi hasil sync, pending update/delete tidak hilang
======================================================================= */
function loadSyncQueue(){
  try{
    const raw = localStorage.getItem(SYNC_QUEUE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      SYNC_QUEUE = Array.isArray(parsed) ? parsed : [];
      return;
    }
  }catch(e){}
  SYNC_QUEUE = [];
}
function saveSyncQueue(){
  try{ localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(SYNC_QUEUE.slice(-500))); }catch(e){}
}
function pendingSyncCount(){ return SYNC_QUEUE.length; }
function getPendingDeleteIds(){
  return new Set(SYNC_QUEUE.filter(op=>op.action==='delete').map(op=>op.id));
}
function cleanRecordForServer(record){
  const clone = { ...(record||{}) };
  delete clone._syncStatus;
  delete clone._clientOnly;
  // Sertakan juga alias nama kolom Bahasa Indonesia (selain camelCase) supaya data tetap tersimpan
  // dgn benar apa pun konvensi nama kolom yg dipakai backend Google Sheets/Apps Script — terutama
  // utk field yg pernah dilaporkan hilang seperti Keterangan.
  clone['Keterangan'] = clone.keterangan;
  clone['Tanggal Input'] = clone.tanggalInput;
  clone['Tanggal Update'] = clone.tanggalUpdate;
  clone['Nama Debitur'] = clone.namaDebitur;
  clone['Nama Pasangan'] = clone.namaPasangan;
  clone['No HP'] = clone.noHp;
  clone['New/RO'] = clone.newRo;
  clone['Sumber Order'] = clone.sumberOrder;
  clone['Status'] = clone.status;
  clone['Posisi'] = clone.posisi;
  return clone;
}
function enqueueSync(action, payload){
  const id = action === 'delete' ? payload : payload.id;
  if(!id) return;
  // Kompakkan queue agar operasi yang sama tidak menumpuk.
  if(action === 'delete'){
    SYNC_QUEUE = SYNC_QUEUE.filter(op=>op.id !== id);
    SYNC_QUEUE.push({ opId: uid(), action:'delete', id, timestamp: nowISO() });
  } else if(action === 'create'){
    const existing = SYNC_QUEUE.find(op=>op.id === id && op.action === 'create');
    if(existing){ existing.record = cleanRecordForServer(payload); existing.timestamp = nowISO(); }
    else {
      SYNC_QUEUE = SYNC_QUEUE.filter(op=>!(op.id === id && op.action === 'delete'));
      SYNC_QUEUE.push({ opId: uid(), action:'create', id, record: cleanRecordForServer(payload), timestamp: nowISO() });
    }
  } else if(action === 'update'){
    const existingCreate = SYNC_QUEUE.find(op=>op.id === id && op.action === 'create');
    if(existingCreate){ existingCreate.record = cleanRecordForServer(payload); existingCreate.timestamp = nowISO(); }
    else {
      const existingUpdate = SYNC_QUEUE.find(op=>op.id === id && op.action === 'update');
      if(existingUpdate){ existingUpdate.record = cleanRecordForServer(payload); existingUpdate.timestamp = nowISO(); }
      else SYNC_QUEUE.push({ opId: uid(), action:'update', id, record: cleanRecordForServer(payload), timestamp: nowISO() });
    }
  }
  saveSyncQueue();
}
function dequeueSync(opId){
  SYNC_QUEUE = SYNC_QUEUE.filter(op=>op.opId !== opId);
  saveSyncQueue();
}
async function processSyncQueue(){
  if(STORAGE_MODE !== 'online' || isSyncingQueue || SYNC_QUEUE.length === 0) return { success: false, processed:0 };
  isSyncingQueue = true;
  let processed = 0;
  try{
    for(const op of [...SYNC_QUEUE]){
      let res;
      if(op.action === 'create') res = await gasCreate(op.record);
      else if(op.action === 'update') res = await gasUpdate(op.record);
      else if(op.action === 'delete') res = await gasDelete(op.id);
      if(res && res.success){
        processed++;
        if(op.action === 'create') markSyncedLocally(op.id);
        dequeueSync(op.opId);
      } else {
        // Hentikan agar urutan operasi tetap aman. Coba lagi pada refresh berikutnya.
        break;
      }
    }
    if(processed > 0){
      saveToLocalStorage();
      renderNotifBadge();
      showToast(`${processed} perubahan tertunda berhasil disinkronkan.`);
      pushNotification('sync', `${processed} perubahan lokal berhasil disinkronkan ke Google Sheets.`);
    }
    return { success: SYNC_QUEUE.length === 0, processed };
  }finally{
    isSyncingQueue = false;
  }
}
// Menandai record sbg sudah terkonfirmasi tersimpan di server, sehingga tidak lagi
// dianggap "belum pernah sync" oleh reconcileWithServer() saat reload berikutnya.
function markSyncedLocally(id){
  const r = RECORDS.find(x=>x.id===id);
  if(r && r._clientOnly){ delete r._clientOnly; saveToLocalStorage(); }
}
async function syncCreateChecked(record){
  if(STORAGE_MODE !== 'online'){
    enqueueSync('create', record);
    return false;
  }
  const res = await gasCreate(cleanRecordForServer(record));
  if(!res || !res.success){ enqueueSync('create', record); return false; }
  markSyncedLocally(record.id);
  return true;
}
async function syncUpdateChecked(record){
  if(STORAGE_MODE !== 'online'){
    enqueueSync('update', record);
    return false;
  }
  const res = await gasUpdate(cleanRecordForServer(record));
  if(!res || !res.success){ enqueueSync('update', record); return false; }
  return true;
}
async function syncDeleteChecked(id){
  if(STORAGE_MODE !== 'online'){
    enqueueSync('delete', id);
    return false;
  }
  const res = await gasDelete(id);
  if(!res || !res.success){ enqueueSync('delete', id); return false; }
  return true;
}

let audioCtx = null;
function playNotifSound(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.36);
  }catch(e){}
}

async function gasList(){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000); // 10 detik timeout
  try{
    const res = await fetch(GAS_URL + '?action=list', { method:'GET', signal: controller.signal });
    clearTimeout(timer);
    if(!res.ok) throw new Error(`HTTP ${res.status} saat memuat Google Sheets`);
    const data = await res.json();
    if(!data.success) throw new Error(data.error || 'Gagal memuat dari Google Sheets');
    return (data.records || []).map(coerceRecord);
  }catch(err){
    clearTimeout(timer);
    throw err;
  }
}

// Menyatukan data lokal dengan data dari Google Sheets secara AMAN.
// Ini menggantikan logika lama yang naif ("data lokal yg tidak ada di server = data baru,
// hidupkan lagi & kirim ulang ke server") — logika lama itulah yang menyebabkan record yang
// sudah dihapus (baik lewat tombol Hapus maupun dihapus langsung di Google Sheets) terus
// "bangkit lagi" setiap kali app dimuat ulang, sehingga reminder-nya tidak pernah benar2 berhenti.
//
// v2 — PENTING: sebelumnya, untuk record yg ADA di kedua sisi (lokal & server), sistem SELALU
// memakai versi server apa adanya tanpa dibandingkan dulu. Ini menyebabkan input yang baru saja
// diisi user (mis. field Keterangan) hilang/kosong lagi setiap reload, kalau sinkron ke Google
// Sheets belum sempat membawa balik nilai itu dengan benar (lag/kolom tidak lengkap/dsb).
// Sekarang dibandingkan berdasar "siapa yang lebih baru": data lokal menang kalau masih ada di
// antrean sync yg belum terkonfirmasi ATAU updatedAt lokal >= updatedAt server. Dengan begitu,
// input terakhir user SELALU yang tampil, sesuai prinsip "keterangan selalu menampilkan input
// yang terakhir diinput/terupdate".
//
// Aturan lengkap:
// 1. Record dgn pending-delete lokal -> tetap dianggap terhapus, walau masih muncul di server.
// 2. Record yg pernah ditandai tombstone (pernah dihapus dari app ini) -> tetap terhapus,
//    walau race-condition membuat server sempat masih mengirim datanya.
// 3. Record lokal yg TIDAK ada di server:
//      - Kalau _clientOnly (memang baru dibuat & belum pernah sukses sync) -> pertahankan &
//        antre ulang untuk dikirim ke server (perilaku lama yang benar).
//      - Kalau BUKAN _clientOnly (dulu sudah pernah tersinkron) -> berarti dihapus di luar
//        aplikasi (mis. langsung di Google Sheets). JANGAN dihidupkan lagi. Hapus dari lokal +
//        bersihkan semua jejak reminder/notifikasinya, lalu beri tahu user secara transparan.
// 4. Record lokal yg ADA di server -> pakai yang updatedAt-nya lebih baru (atau lokal, jika masih
//    ada perubahan lokal yg belum terkonfirmasi tersinkron).
function reconcileWithServer(serverRecords){
  pruneOldTombstones();
  const pendingDeleteIds = getPendingDeleteIds();
  const pendingUpdateIds = new Set(SYNC_QUEUE.filter(op=>op.action==='update' || op.action==='create').map(op=>op.id));
  const mapServer = new Map();

  (serverRecords || []).forEach(r=>{
    if(pendingDeleteIds.has(r.id)) return;
    if(TOMBSTONES[r.id]) return;
    mapServer.set(r.id, r);
  });

  const ghostsRemoved = [];
  RECORDS.forEach(lr=>{
    if(pendingDeleteIds.has(lr.id)) return;
    const sv = mapServer.get(lr.id);
    if(!sv){
      if(lr._clientOnly){
        mapServer.set(lr.id, lr);
        enqueueSync('create', lr);
      } else {
        ghostsRemoved.push(lr);
      }
      return;
    }
    // Record ada di kedua sisi — jangan asal timpa dgn versi server, bandingkan dulu.
    const localTime = new Date(lr.updatedAt || lr.createdAt || 0).getTime();
    const serverTime = new Date(sv.updatedAt || sv.createdAt || 0).getTime();
    if(pendingUpdateIds.has(lr.id) || localTime >= serverTime){
      mapServer.set(lr.id, lr); // data lokal lebih baru (atau masih menunggu sync) -> pertahankan lokal
    } else if(!String(sv.keterangan||'').trim() && String(lr.keterangan||'').trim()){
      // Server "menang" berdasar waktu, TAPI keterangan di server kosong padahal lokal ada isinya.
      // Ini pengaman tambahan khusus utk field Keterangan (paling sering dilaporkan hilang akibat
      // proses sinkron ke Google Sheets yg belum sempurna membawa balik nilainya) — jangan pernah
      // menimpa catatan yang sudah diisi user dengan nilai kosong.
      sv.keterangan = lr.keterangan;
    }
    // Pengaman yang sama untuk Tanggal Input: field ini cuma boleh berubah lewat input manual user
    // lewat form edit, TIDAK boleh diam-diam tertimpa kosong/berbeda hanya karena proses sinkron.
    // Kalau server tidak punya tanggal input (kosong) padahal lokal sudah punya, pertahankan nilai lokal.
    if(!String(sv.tanggalInput||'').trim() && String(lr.tanggalInput||'').trim()){
      sv.tanggalInput = lr.tanggalInput;
    }
  });

  RECORDS = Array.from(mapServer.values());

  if(ghostsRemoved.length){
    ghostsRemoved.forEach(r=>{
      markTombstone(r.id);
      Array.from(notifiedKeys).forEach(key=>{ if(key.startsWith(r.id + '::')) notifiedKeys.delete(key); });
      delete aiMessages[r.id];
    });
    saveNotifs();
    const names = ghostsRemoved.map(r=>r.namaDebitur).join(', ');
    pushNotification('info', `${ghostsRemoved.length} data (${names}) sudah tidak ada di Google Sheets — disinkronkan (dihapus) dari aplikasi ini, termasuk semua pengingat reminder-nya.`);
  }
}

async function initDataEngine(){
  // 1. OFFLINE-FIRST: Muat seketika dari LocalStorage agar data tidak pernah hilang/kosong saat dibuka.
  const localData = loadFromLocalStorage();
  if(localData !== null){
    RECORDS = localData;
    STORAGE_MODE = 'syncing';
    render();
  } else {
    RECORDS = [];
    isDataLoading = true;
    render();
  }

  // 2. BACKGROUND SYNC: Coba hubungi Google Sheets, rekonsiliasi aman terhadap pending delete/update lokal.
  try{
    const serverRecords = await gasList();
    STORAGE_MODE = 'online';
    reconcileWithServer(serverRecords);
    saveToLocalStorage();

    const before = pendingSyncCount();
    await processSyncQueue();
    if(before > 0 && pendingSyncCount() === 0){
      showToast('Semua perubahan offline sudah tersinkron ke Google Sheets.');
    }
  }catch(e){
    console.warn('Google Sheets offline/tidak terjangkau. Menggunakan penyimpanan lokal penuh.', e);
    STORAGE_MODE = 'local';
    saveToLocalStorage();
    if(pendingSyncCount() > 0){
      pushNotification('error', `${pendingSyncCount()} perubahan belum tersinkron karena Google Sheets tidak terjangkau.`);
    } else {
      pushNotification('error', 'Google Sheets tidak terjangkau. Aplikasi berjalan dalam mode lokal/offline.');
    }
  }finally{
    isDataLoading = false;
    warnInvalidRecords();
    render();
  }
}

/* =======================================================================
   UTILITIES
======================================================================= */
function formatRibuan(numStr){
  const digits = String(numStr).replace(/[^\d]/g,'');
  if(!digits) return '';
  return digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function parseRibuan(str){
  return parseInt(String(str).replace(/[^\d]/g,''),10) || 0;
}
function formatRupiah(n){
  return 'Rp ' + formatRibuan(String(n || 0));
}
function formatTanggalDDMMYY(isoDate){
  if(!isoDate) return '-';
  const d = new Date(isoDate + 'T00:00:00');
  if(isNaN(d)) return isoDate;
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = String(d.getFullYear()).slice(-2);
  return `${dd}/${mm}/${yy}`;
}
function formatDateTime(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  if(isNaN(d)) return '-';
  return d.toLocaleString('id-ID', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function hoursSince(iso){
  if(!iso) return 0;
  const d = new Date(iso).getTime();
  if(isNaN(d)) return 0;
  return Math.max(0, (Date.now() - d) / 36e5);
}
function formatDurasi(hours){
  if(isNaN(hours) || hours <= 0) return 'Baru saja';
  if(hours < 24) return Math.floor(hours) + ' jam';
  const d = Math.floor(hours/24); const h = Math.floor(hours%24);
  return d + ' hari' + (h>0 ? ' ' + h + ' jam' : '');
}
function parseHolidayDates(){
  const raw = APP_SETTINGS.holidayDates || '';
  return new Set(String(raw).split(/[\s,;]+/).map(x=>x.trim()).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)));
}
function dateKeyLocal(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function isWorkingDay(d){
  // getDay(): 0=Minggu, 1=Senin, ... 6=Sabtu. Hari aktif: Senin–Sabtu.
  if(d.getDay() === 0) return false;
  return !parseHolidayDates().has(dateKeyLocal(d));
}
function businessHoursBetween(startISO, endDate = new Date()){
  const start = new Date(startISO);
  if(!startISO || isNaN(start) || endDate <= start) return 0;
  let cursor = new Date(start);
  let totalMs = 0;
  // Guard agar aman untuk rentang sangat panjang.
  let guard = 0;
  while(cursor < endDate && guard < 5000){
    guard++;
    const dayStart = new Date(cursor); dayStart.setHours(WORK_START_HOUR,0,0,0);
    const dayEnd = new Date(cursor); dayEnd.setHours(WORK_END_HOUR,0,0,0);
    if(isWorkingDay(cursor)){
      const from = new Date(Math.max(cursor.getTime(), dayStart.getTime()));
      const to = new Date(Math.min(endDate.getTime(), dayEnd.getTime()));
      if(to > from) totalMs += to - from;
    }
    cursor = new Date(cursor);
    cursor.setDate(cursor.getDate() + 1);
    cursor.setHours(0,0,0,0);
  }
  return totalMs / 36e5;
}
function addBusinessHours(startDate, hoursToAdd){
  let remainingMs = Math.max(0, hoursToAdd) * 36e5;
  let cursor = new Date(startDate || new Date());
  let guard = 0;
  while(remainingMs > 0 && guard < 5000){
    guard++;
    const dayStart = new Date(cursor); dayStart.setHours(WORK_START_HOUR,0,0,0);
    const dayEnd = new Date(cursor); dayEnd.setHours(WORK_END_HOUR,0,0,0);
    if(!isWorkingDay(cursor) || cursor >= dayEnd){
      cursor.setDate(cursor.getDate() + 1);
      cursor.setHours(WORK_START_HOUR,0,0,0);
      continue;
    }
    if(cursor < dayStart) cursor = new Date(dayStart);
    const availableMs = Math.max(0, dayEnd - cursor);
    const step = Math.min(remainingMs, availableMs);
    cursor = new Date(cursor.getTime() + step);
    remainingMs -= step;
  }
  return cursor;
}
function workingHoursSince(iso){ return businessHoursBetween(iso, new Date()); }
function formatWorkDurasi(hours){
  if(isNaN(hours) || hours <= 0) return '0 jam kerja';
  if(hours < 1) return Math.round(hours*60) + ' menit kerja';
  const d = Math.floor(hours / WORK_HOURS_PER_DAY);
  const h = Math.floor(hours % WORK_HOURS_PER_DAY);
  if(d <= 0) return h + ' jam kerja';
  return d + ' hari kerja' + (h>0 ? ' ' + h + ' jam' : '');
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3500);
}

/* =======================================================================
   REMINDER / AI LOGIC (Cerdas & Cepat)
======================================================================= */
function computeOverdue(){
  const list = [];
  RECORDS.forEach(r=>{
    // Pengingat berhenti total begitu status masuk kondisi final: Batal, Reject Slik, Reject Non Slik, atau Approved.
    if(REMINDER_STOP_STATUSES.includes(r.status)) return;
    const threshold = STAGE_THRESHOLD_HOURS[r.posisi];
    if(threshold == null) return;
    const elapsed = workingHoursSince(r.stageEnteredAt);
    const snoozeUntil = r.snoozeUntil ? new Date(r.snoozeUntil).getTime() : 0;
    if(elapsed >= threshold && Date.now() >= snoozeUntil){
      list.push({ record:r, elapsedHours:elapsed, thresholdHours:threshold });
    }
  });
  list.sort((a,b)=> (b.elapsedHours-b.thresholdHours) - (a.elapsedHours-a.thresholdHours));
  return list;
}

function localFallbackMessage(item){
  const r = item.record;
  const dur = formatWorkDurasi(item.elapsedHours);
  const bat = formatWorkDurasi(item.thresholdHours);
  return `⚠️ Debitur ${r.namaDebitur} (${r.unit} ${r.merek}) tertahan di tahap "${r.posisi}" selama ${dur} (melebihi batas normal ${bat}). Perhitungan mengikuti jam kerja ${WORKDAY_LABEL}, tidak menghitung hari Minggu/tanggal merah. CMO ${r.cmo} disarankan segera menindaklanjuti progres pengajuan ini.`;
}

async function callAIForOverdue(overdueList){
  if(overdueList.length === 0){ aiMessages = {}; return; }
  aiLoading = true;
  renderAIPanel();
  
  // Karena panggil API Anthropic langsung dari browser diblokir CORS,
  // kita gunakan generator pengingat cerdas internal agar tidak ada error network.
  setTimeout(() => {
    const map = {};
    overdueList.forEach(it => {
      map[it.record.id] = { message: localFallbackMessage(it), generatedAt: nowISO() };
    });
    aiMessages = map;
    aiLoading = false;
    renderAIPanel();
  }, 400);
}

function purgeReminderTracesForFinalRecords(){
  // Begitu status jadi Batal/Reject Slik/Reject Non Slik/Approved, hapus jejak dedupe notifikasi
  // milik record tsb. Ini memastikan pengingat benar-benar berhenti (bukan sekadar tidak muncul baru),
  // dan jika suatu saat status dikembalikan ke Proses/Pending, notifikasi bisa muncul lagi secara wajar.
  RECORDS.forEach(r=>{
    if(!REMINDER_STOP_STATUSES.includes(r.status)) return;
    Array.from(notifiedKeys).forEach(key=>{
      if(key.startsWith(r.id + '::')) notifiedKeys.delete(key);
    });
  });
}

// Deteksi record yang nilai status/posisi-nya TIDAK persis sama dengan STATUS_LIST/POSISI_LIST
// (walau sudah lewat normalizeToListValue). Biasanya terjadi kalau data diedit manual langsung
// di Google Sheets dengan kata yang beda maknanya sedikit (mis. "Cancel" alih-alih "Batal").
// Record seperti ini TIDAK akan pernah dianggap "final" oleh sistem, sehingga reminder terus
// menyala walau menurut orang yang mengedit datanya sudah "selesai".
function findInvalidStatusOrPosisiRecords(){
  return RECORDS.filter(r => !STATUS_LIST.includes(r.status) || !POSISI_LIST.includes(r.posisi));
}

function warnInvalidRecords(){
  const invalid = findInvalidStatusOrPosisiRecords();
  invalid.forEach(r=>{
    const key = `datainvalid::${r.id}::${r.status}::${r.posisi}`;
    if(notifiedKeys.has(key)) return;
    notifiedKeys.add(key);
    const parts = [];
    if(!STATUS_LIST.includes(r.status)) parts.push(`status="${r.status || '(kosong)'}"`);
    if(!POSISI_LIST.includes(r.posisi)) parts.push(`posisi="${r.posisi || '(kosong)'}"`);
    pushNotification('error', `Data ${r.namaDebitur} punya ${parts.join(' & ')} yang tidak dikenali sistem. Reminder tidak akan berhenti otomatis sampai diperbaiki lewat form Edit (pilih ulang dari dropdown).`, { recordId: r.id });
  });
  if(invalid.length) saveNotifs();
}

function refreshReminders(){
  purgeReminderTracesForFinalRecords();
  warnInvalidRecords();
  const overdue = computeOverdue();
  overdue.forEach(it=>{
    const key = `${it.record.id}::${it.record.posisi}`;
    if(!notifiedKeys.has(key)){
      notifiedKeys.add(key);
      pushNotification('overdue', `Debitur ${it.record.namaDebitur} tertahan ${formatWorkDurasi(it.elapsedHours)} di tahap "${it.record.posisi}" (batas ${formatWorkDurasi(it.thresholdHours)}).`, { recordId: it.record.id });
      saveNotifs();
    }
  });
  callAIForOverdue(overdue);
}

// ALUR KERJA SLA — Konfirmasi/tunda BUKAN LAGI sekadar menyembunyikan reminder selama X jam,
// melainkan mereset penuh durasi SLA ke 0 (sama seperti saat edit/update posisi), lalu berjalan
// lagi dari awal mengikuti ketentuan durasi SLA posisi saat ini.
async function confirmReminder(id){
  const r = RECORDS.find(x=>x.id===id);
  if(!r) return;
  const ts = nowISO();
  const prevElapsedHours = workingHoursSince(r.stageEnteredAt);
  const updated = {
    ...r,
    updatedAt: ts,
    tanggalUpdate: todayLocalISO(),
    stageEnteredAt: ts,
    snoozeUntil: null,
    history: [...(r.history||[]), { timestamp: ts, posisi:r.posisi, status:r.status, note:`Dikonfirmasi masih diproses. SLA direset ke 0 (sebelumnya berjalan ${formatWorkDurasi(prevElapsedHours)}), mulai berjalan lagi sesuai ketentuan durasi posisi "${r.posisi}".` }]
  };
  try{
    Object.assign(r, updated);
    saveToLocalStorage();
    const synced = await syncUpdateChecked(updated);
    showToast(synced
      ? `Dikonfirmasi — SLA ${r.namaDebitur} direset dan tersinkron.`
      : `Dikonfirmasi — SLA ${r.namaDebitur} direset lokal. Sync server menunggu koneksi.`);
  }catch(err){
    console.error(err);
    showToast('Gagal menyimpan konfirmasi.');
  }
  refreshReminders();
  renderTable();
  renderCards();
}

async function callClaudeAPI(userText){
  const summary = buildDataSummaryForAI();
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': APP_SETTINGS.aiApiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model: APP_SETTINGS.aiModel || 'claude-sonnet-5',
      max_tokens: 700,
      system: 'Anda adalah asisten analisis data untuk aplikasi tracking pengajuan kredit motor & mobil. Jawab singkat, jelas, dan dalam Bahasa Indonesia, berdasarkan ringkasan data yang diberikan. Jika data tidak cukup untuk menjawab, katakan dengan jujur.',
      messages: [
        { role:'user', content: `Ringkasan data saat ini:\n${summary}\n\nPertanyaan pengguna: ${userText}` }
      ]
    })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message || 'API error');
  const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text);
  return textBlocks.join('\n') || 'Maaf, tidak ada respons dari model.';
}

function buildDataSummaryForAI(){
  const total = RECORDS.length;
  const byStatus = {}; STATUS_LIST.forEach(s=> byStatus[s] = RECORDS.filter(r=>r.status===s).length);
  const byPosisi = {}; POSISI_LIST.forEach(p=> byPosisi[p] = RECORDS.filter(r=>r.posisi===p).length);
  const overdue = computeOverdue();
  const totalPinjaman = RECORDS.reduce((a,r)=>a+(r.pinjaman||0),0);
  const cmoStats = CMO_LIST.map(c=>({ cmo:c, total: RECORDS.filter(r=>r.cmo===c).length, approved: RECORDS.filter(r=>r.cmo===c && r.status==='Approved').length }));
  return JSON.stringify({ total, byStatus, byPosisi, totalPinjaman, overdueCount: overdue.length,
    overdueNames: overdue.slice(0,10).map(o=>`${o.record.namaDebitur} (${o.record.posisi}, ${formatWorkDurasi(o.elapsedHours)})`),
    cmoStats }, null, 0);
}

// Lightweight local NLU — pattern-matches common Indonesian questions to real computations on RECORDS
function analyzeQuery(qRaw){
  const q = qRaw.toLowerCase();
  const overdue = computeOverdue();

  if(/(tertunda|terlambat|overdue|perlu.*tindak|perlu.*perhatian)/.test(q)){
    if(overdue.length === 0) return 'Saat ini tidak ada pengajuan yang tertunda melewati batas waktu normal. Semua berjalan lancar! ✅';
    const top = overdue.slice(0,5).map(o=>`• ${o.record.namaDebitur} — tahap "${o.record.posisi}", sudah ${formatWorkDurasi(o.elapsedHours)} (batas ${formatWorkDurasi(o.thresholdHours)})`).join('\n');
    return `Ada ${overdue.length} pengajuan yang melewati batas waktu di tahapnya:\n${top}${overdue.length>5?`\n...dan ${overdue.length-5} lainnya.`:''}`;
  }

  if(/(cmo).*(produktif|terbaik|tercepat|leaderboard|ranking|peringkat)/.test(q) || /siapa.*cmo/.test(q)){
    const stats = computeCmoLeaderboard();
    if(stats.length === 0) return 'Belum ada data CMO untuk dianalisis.';
    const t = stats[0];
    return `CMO paling produktif saat ini adalah ${t.cmo} dengan ${t.total} pengajuan ditangani dan ${t.approved} disetujui (tingkat approval ${t.approvalRate}%). Berikut 3 teratas:\n${stats.slice(0,3).map((s,i)=>`${i+1}. ${s.cmo} — ${s.total} pengajuan, ${s.approvalRate}% approval`).join('\n')}`;
  }

  if(/(total|jumlah).*(pinjaman|nilai).*(aktif|proses|pipeline)|pipeline/.test(q)){
    const kpi = computeKPIs();
    return `Total nilai pinjaman yang masih berjalan (status Proses/Pending) saat ini adalah ${formatRupiah(kpi.pipelineValue)}, dari ${kpi.pipelineCount} pengajuan aktif.`;
  }

  if(/(approval|persetujuan).*(rate|tingkat|persentase)|tingkat.*disetujui/.test(q)){
    const kpi = computeKPIs();
    return `Tingkat persetujuan (approval rate) saat ini adalah ${kpi.approvalRate}% dari total pengajuan yang sudah diputuskan (Approved vs Reject/Batal).`;
  }

  if(/(berapa|jumlah|total).*(pengajuan|data)/.test(q) && !/pinjaman/.test(q)){
    return `Total pengajuan yang tercatat saat ini ada ${RECORDS.length} data.`;
  }

  const statusMatch = STATUS_LIST.find(s=> q.includes(s.toLowerCase()));
  if(statusMatch){
    const list = RECORDS.filter(r=>r.status===statusMatch);
    return `Ada ${list.length} pengajuan dengan status "${statusMatch}"${list.length? ', di antaranya: ' + list.slice(0,5).map(r=>r.namaDebitur).join(', ') + (list.length>5?', dan lainnya.':'.') : '.'}`;
  }
  const posisiMatch = POSISI_LIST.find(p=> q.includes(p.toLowerCase()));
  if(posisiMatch){
    const list = RECORDS.filter(r=>r.posisi===posisiMatch);
    return `Ada ${list.length} pengajuan yang sedang di tahap "${posisiMatch}"${list.length? ', di antaranya: ' + list.slice(0,5).map(r=>r.namaDebitur).join(', ') + (list.length>5?', dan lainnya.':'.') : '.'}`;
  }

  // Search by debtor name
  const found = RECORDS.filter(r=> r.namaDebitur && q.includes(r.namaDebitur.toLowerCase().split(' ')[0]) && r.namaDebitur.toLowerCase().split(' ')[0].length > 2);
  if(found.length > 0){
    const r = found[0];
    return `Data ${r.namaDebitur}: unit ${r.unit} ${r.merek} ${r.tahun}, pinjaman ${formatRupiah(r.pinjaman)}, CMO ${r.cmo}, posisi "${r.posisi}", status "${r.status}", sudah ${formatWorkDurasi(workingHoursSince(r.stageEnteredAt))} di tahap ini berdasarkan jam kerja ${WORKDAY_LABEL}.`;
  }

  if(/(bantuan|help|apa yang bisa)/.test(q)){
    return 'Saya bisa membantu Anda dengan hal-hal berikut:\n• Cek pengajuan yang tertunda/terlambat\n• Ranking performa CMO\n• Total nilai pinjaman aktif (pipeline)\n• Tingkat approval\n• Jumlah pengajuan per status/posisi\n• Cari data berdasarkan nama debitur\n\nSilakan tanya dengan bahasa natural, misalnya "ada berapa yang pending?"';
  }

  return `Saya belum bisa memahami pertanyaan itu secara spesifik dari data yang ada. Coba tanyakan tentang: jumlah pengajuan, status/posisi tertentu, performa CMO, nilai pipeline, atau nama debitur. Ketik "bantuan" untuk melihat contoh pertanyaan.`;
}

/* =======================================================================
   ANALYTICS / KPI COMPUTATIONS
======================================================================= */
function computeKPIs(){
  const total = RECORDS.length;
  const approved = RECORDS.filter(r=>r.status==='Approved');
  const rejectedOrCancel = RECORDS.filter(r=>['Reject Slik','Reject Non Slik','Batal'].includes(r.status));
  const decided = approved.length + rejectedOrCancel.length;
  const approvalRate = decided > 0 ? Math.round((approved.length/decided)*1000)/10 : 0;

  const active = RECORDS.filter(r=>['Proses','Pending'].includes(r.status));
  const pipelineValue = active.reduce((a,r)=>a+(r.pinjaman||0),0);

  const overdue = computeOverdue();
  const slaCompliance = active.length > 0 ? Math.round(((active.length - overdue.length)/active.length)*1000)/10 : 100;

  let avgApproveHours = 0;
  if(approved.length){
    const durations = approved.map(r=>{
      const created = new Date(r.createdAt).getTime();
      const lastApprovedHistory = (r.history||[]).slice().reverse().find(h=>h.status==='Approved');
      const approvedAt = lastApprovedHistory ? new Date(lastApprovedHistory.timestamp).getTime() : Date.now();
      return Math.max(0,(approvedAt-created)/36e5);
    });
    avgApproveHours = durations.reduce((a,b)=>a+b,0)/durations.length;
  }

  return {
    total, approvalRate, pipelineValue, pipelineCount: active.length,
    slaCompliance, avgApproveHours, overdueCount: overdue.length
  };
}

function computeCmoLeaderboard(){
  return CMO_LIST.map(c=>{
    const list = RECORDS.filter(r=>r.cmo===c);
    const approved = list.filter(r=>r.status==='Approved').length;
    const decided = list.filter(r=>['Approved','Reject Slik','Reject Non Slik','Batal'].includes(r.status)).length;
    const approvalRate = decided > 0 ? Math.round((approved/decided)*1000)/10 : 0;
    const pinjamanTotal = list.reduce((a,r)=>a+(r.pinjaman||0),0);
    return { cmo:c, total:list.length, approved, approvalRate, pinjamanTotal };
  }).filter(s=>s.total>0).sort((a,b)=> b.total - a.total || b.approvalRate - a.approvalRate);
}

function isFilterActive(){
  return !!(filters.q || filters.unit || filters.cmo || filters.posisi || filters.status || filters.periode || filters.sumberOrder);
}

// Menghitung rentang tanggal (YYYY-MM-DD, inklusif) berdasarkan pilihan periode cepat.
function getPeriodeRange(){
  const { periode, dateFrom, dateTo } = filters;
  if(!periode) return null;
  const pad = n => String(n).padStart(2,'0');
  const toKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const now = new Date();
  if(periode === 'custom'){
    if(!dateFrom && !dateTo) return null;
    return { from: dateFrom || '0000-01-01', to: dateTo || '9999-12-31' };
  }
  if(periode === 'today'){
    const k = toKey(now); return { from:k, to:k };
  }
  if(periode === 'week'){
    const day = (now.getDay() + 6) % 7; // Senin = 0
    const start = new Date(now); start.setDate(now.getDate() - day);
    const end = new Date(start); end.setDate(start.getDate() + 6);
    return { from: toKey(start), to: toKey(end) };
  }
  if(periode === 'month'){
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    return { from: toKey(start), to: toKey(end) };
  }
  if(periode === 'lastmonth'){
    const start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const end = new Date(now.getFullYear(), now.getMonth(), 0);
    return { from: toKey(start), to: toKey(end) };
  }
  if(periode === 'year'){
    return { from: `${now.getFullYear()}-01-01`, to: `${now.getFullYear()}-12-31` };
  }
  return null;
}

function renderCards(){
  const unitEl = document.getElementById('cardsUnit');
  const posEl = document.getElementById('cardsPosisi');
  const statEl = document.getElementById('cardsStatus');
  const flagEl = document.getElementById('cardsFilterFlag');
  if(!posEl || !statEl) return;

  const source = getFilteredSortedRecords();
  const filterOn = isFilterActive();

  const unitCounts = {}; UNIT_LIST.forEach(u=>unitCounts[u]={count:0, pinjaman:0});
  const posCounts = {}; POSISI_LIST.forEach(p=>posCounts[p]=0);
  const statCounts = {}; STATUS_LIST.forEach(s=>statCounts[s]=0);
  let totalPinjaman = 0;
  source.forEach(r=>{
    if(unitCounts[r.unit]){ unitCounts[r.unit].count++; unitCounts[r.unit].pinjaman += (r.pinjaman||0); }
    if(posCounts[r.posisi] !== undefined) posCounts[r.posisi]++;
    if(statCounts[r.status] !== undefined) statCounts[r.status]++;
    totalPinjaman += (r.pinjaman||0);
  });

  if(unitEl){
    unitEl.innerHTML = UNIT_LIST.map(u=>`
      <div class="stat-card" style="--accent:var(${UNIT_COLOR[u]})">
        <div class="num">${unitCounts[u].count}</div>
        <div class="lbl">${u === 'Motor' ? '🏍️ ' : '🚗 '}${u}</div>
        <div style="font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-dim); margin-top:6px;">${formatRupiah(unitCounts[u].pinjaman)}</div>
      </div>
    `).join('');
  }

  posEl.innerHTML = POSISI_LIST.map(p=>`
    <div class="stat-card" style="--accent:var(${POSISI_COLOR[p]})">
      <div class="num">${posCounts[p]}</div>
      <div class="lbl">${p}</div>
    </div>
  `).join('') + `
    <div class="stat-card total">
      <div class="num">${source.length}</div>
      <div class="lbl">${filterOn ? 'Total (Terfilter)' : 'Total Keseluruhan'}</div>
      <div class="sub-num">${formatRupiah(totalPinjaman)}</div>
    </div>
  `;

  statEl.innerHTML = STATUS_LIST.map(s=>`
    <div class="stat-card" style="--accent:var(${STATUS_COLOR[s]})">
      <div class="num">${statCounts[s]}</div>
      <div class="lbl">${s}</div>
    </div>
  `).join('');

  if(flagEl){
    flagEl.style.display = filterOn ? 'inline-flex' : 'none';
  }
}

// Sumber Order adalah field teks bebas (bukan daftar tetap seperti Unit/CMO), jadi daftar filternya
// diambil otomatis dari nilai unik yang ada di data — tersusun rapi alfabetis.
function getUniqueSumberOrderList(){
  const set = new Set();
  RECORDS.forEach(r=>{ const v = normalizeText(r.sumberOrder||''); if(v) set.add(v); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b, 'id'));
}

function getFilteredSortedRecords(){
  const periodeRange = getPeriodeRange();
  let list = RECORDS.filter(r=>{
    if(filters.unit && r.unit !== filters.unit) return false;
    if(filters.cmo && r.cmo !== filters.cmo) return false;
    if(filters.posisi && r.posisi !== filters.posisi) return false;
    if(filters.status && r.status !== filters.status) return false;
    if(filters.sumberOrder && normalizeText(r.sumberOrder||'') !== filters.sumberOrder) return false;
    if(periodeRange){
      const tgl = r.tanggalInput || '';
      if(!tgl || tgl < periodeRange.from || tgl > periodeRange.to) return false;
    }
    if(filters.q){
      const hay = [r.namaDebitur, r.namaPasangan, r.noHp, r.merek, r.sumberOrder].join(' ').toLowerCase();
      if(!hay.includes(filters.q)) return false;
    }
    return true;
  });
  const { key, dir } = sortState;
  list.sort((a,b)=>{
    let av = a[key], bv = b[key];
    if(key === 'pinjaman'){ av = a.pinjaman || 0; bv = b.pinjaman || 0; }
    if(av === undefined) av = '';
    if(bv === undefined) bv = '';
    if(av < bv) return dir==='asc' ? -1 : 1;
    if(av > bv) return dir==='asc' ? 1 : -1;
    return 0;
  });
  return list;
}

function renderPaginationBar(totalCount, totalPages, startIdx, shownCount){
  const bar = document.getElementById('paginationBar');
  if(!bar) return;
  const page = pagination.page;
  let pageBtns = '';
  const windowSize = 5;
  let from = Math.max(1, page - Math.floor(windowSize/2));
  let to = Math.min(totalPages, from + windowSize - 1);
  from = Math.max(1, to - windowSize + 1);
  for(let p=from; p<=to; p++){
    pageBtns += `<button data-page="${p}" class="${p===page?'current':''}">${p}</button>`;
  }
  bar.innerHTML = `
    <div class="info">Menampilkan ${totalCount ? startIdx+1 : 0}–${startIdx+shownCount} dari ${totalCount} data</div>
    <div class="pages">
      <select id="pagSize" title="Baris per halaman">
        ${[10,25,50,100].map(n=>`<option value="${n}" ${pagination.pageSize===n?'selected':''}>${n} / hal</option>`).join('')}
      </select>
      <button data-page="${page-1}" ${page<=1?'disabled':''}>&#8249;</button>
      ${pageBtns}
      <button data-page="${page+1}" ${page>=totalPages?'disabled':''}>&#8250;</button>
    </div>
  `;
  bar.querySelectorAll('[data-page]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const p = parseInt(b.dataset.page,10);
      if(!isNaN(p) && p>=1 && p<=totalPages){ pagination.page = p; renderTable(); }
    });
  });
  const sizeSel = document.getElementById('pagSize');
  if(sizeSel) sizeSel.addEventListener('change', (e)=>{
    pagination.pageSize = parseInt(e.target.value,10);
    pagination.page = 1;
    renderTable();
  });
}

  });

      if(wrap && String(el.value).trim() !== '') wrap.classList.remove('invalid');
